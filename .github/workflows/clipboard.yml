name: clipboard

# The system clipboard backends (platform/clipboard) on real clipboards: X11 under Xvfb and
# Wayland data-control under headless sway on Linux, NSPasteboard on macOS, Win32 on Windows.

on:
  push:
    branches: ["**"]
    paths: ["platform/clipboard/**", "build.zig", ".github/workflows/clipboard.yml"]
  pull_request:
    paths: ["platform/clipboard/**", "build.zig", ".github/workflows/clipboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Wayland, X11, sway and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libx11-dev libxfixes-dev sway xvfb wl-clipboard xclip
      - name: Build without a display (the test skips)
        run: zig build test-clipboard -Dlinux-clipboard --summary all
      - name: X11 (Xvfb)
        run: |
          Xvfb :77 -screen 0 640x480x24 &
          sleep 1
          DISPLAY=:77 zig build test-clipboard -Dlinux-clipboard --summary all
      - name: Wayland wlr-data-control (headless sway)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null &
          for i in $(seq 50); do ls "$XDG_RUNTIME_DIR"/wayland-* >/dev/null 2>&1 && break; sleep 0.1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? | head -1)")
          zig build test-clipboard -Dlinux-clipboard --summary all

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: NSPasteboard
        run: zig build test-clipboard --summary all

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Win32 clipboard
        run: zig build test-clipboard --summary all

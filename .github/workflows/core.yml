name: core

# Core unit tests on every host OS, plus the wasm32 compile check. No Rust needed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig core platform codec sim/audio.zig sim/audio_main.zig
      - name: Core tests (Debug)
        run: zig build test --summary all
      - name: Core tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: wasm32 compile check
        if: runner.os == 'Linux'
        run: zig build check-wasm --summary all
      - name: libopus for every target (cross-compiled)
        if: runner.os == 'Linux'
        run: zig build check-opus --summary all
      # Windows apps link the MSVC-ABI shim, so libopus must build and pass there too.
      - name: libopus and audio tests (x86_64-windows-msvc)
        if: runner.os == 'Windows'
        run: zig build test-audio -Dtarget=x86_64-windows-msvc --summary all
      - name: Audio scenarios (full length)
        run: zig build audio-sim -Doptimize=ReleaseSafe

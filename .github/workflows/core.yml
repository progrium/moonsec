name: core

# Core unit tests on every host OS, plus the wasm32 compile check. No Rust needed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig core
      - name: Core tests (Debug)
        run: zig build test --summary all
      - name: Core tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: wasm32 compile check
        if: runner.os == 'Linux'
        run: zig build check-wasm --summary all

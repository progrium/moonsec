name: release

# Installers for every host platform (Phase 7, 7G): Linux .deb/.rpm/tarball, a Windows
# MSI with the host service, macOS .pkg/.dmg. Each is signed when that platform's
# secrets are set and unsigned otherwise; packaging/README.md lists the secrets.
#
# Manual only, like every workflow here. A run builds, tests the Linux packages by
# installing them and streaming from the installed host, and uploads the packages as
# artifacts. With `publish`, a run on a v* tag also creates a *draft* GitHub release;
# a person reviews and publishes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z[-pre]); empty: from the v* tag or git describe"
        required: false
        default: ""
      require_signing:
        description: "Fail when a platform's signing secrets are missing"
        type: boolean
        default: false
      idd_package_url:
        description: "Optional: URL of a zip with the attestation-signed IddCx driver package (x64) to put in the MSI"
        required: false
        default: ""
      publish:
        description: "On a v* tag: create a draft GitHub release with the packages"
        type: boolean
        default: false

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always
  MOONSEC_VERSION: ${{ inputs.version }}

jobs:
  notices:
    name: shim notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by shim/rust-toolchain.toml)
        working-directory: shim
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: cargo-about
        working-directory: shim
        run: cargo about generate --locked --fail -c about.toml -o THIRD_PARTY_NOTICES.md about.hbs
      - uses: actions/upload-artifact@v4
        with:
          name: shim-notices
          path: shim/THIRD_PARTY_NOTICES.md

  linux:
    name: linux ${{ matrix.arch }}
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-22.04, zig_target: x86_64-linux-gnu.2.31 }
          - { arch: aarch64, os: ubuntu-22.04-arm, zig_target: aarch64-linux-gnu.2.31 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - id: shim
        run: |
          # A pinned shim release (shim/pin-release.sh) means no Rust on app builds.
          if grep -q '^ *\.iroh_shim_' build.zig.zon; then echo "flag=-Dshim=prebuilt" >> "$GITHUB_OUTPUT"
          else (cd shim && (rustup show active-toolchain || rustup toolchain install)); fi
      - name: Build moonsec
        run: zig build install-moonsec ${{ steps.shim.outputs.flag }} -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe
      - uses: actions/download-artifact@v4
        with:
          name: shim-notices
          path: notices
      - name: Packaging tools
        run: sudo apt-get update -q && sudo apt-get install -yq rpm dpkg-dev
      - name: Notices
        run: packaging/notices/gen.sh --package linux --bin zig-out/bin/moonsec --shim-notices notices/THIRD_PARTY_NOTICES.md --out dist/linux-notices.md
      - name: Packages
        run: packaging/linux/build.sh --bin zig-out/bin/moonsec --arch ${{ matrix.arch }} --notices dist/linux-notices.md --out dist
      - name: Install the .deb and stream from the installed host
        run: sudo packaging/linux/test-install.sh dist/*.deb dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  windows:
    name: windows ${{ matrix.arch }}
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-2022, zig_target: x86_64-windows-msvc, rust: x86_64-pc-windows-msvc }
          - { arch: arm64, os: windows-11-arm, zig_target: aarch64-windows-msvc, rust: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        if: matrix.arch == 'x64'
        with:
          version: ${{ env.ZIG_VERSION }}
      # As in shim.yml: the native aarch64-windows Zig crashes on windows-11-arm.
      - name: Zig (x86_64 under emulation)
        if: matrix.arch == 'arm64'
        run: |
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip" -o "$RUNNER_TEMP/zig.zip"
          unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - id: shim
        working-directory: shim
        run: |
          if grep -q '^ *\.iroh_shim_' ../build.zig.zon; then echo "flag=-Dshim=prebuilt" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! command -v rustup >/dev/null; then
            curl -sSfL https://win.rustup.rs/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }} -o "$RUNNER_TEMP/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.rust }}
      - name: Build moonsec and the service
        run: |
          zig build install-moonsec ${{ steps.shim.outputs.flag }} -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe
          (cd packaging/windows/svc && zig build test && zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p ../../../zig-out)
          ls -l zig-out/bin
      - uses: actions/download-artifact@v4
        with:
          name: shim-notices
          path: notices
      - name: Notices and version
        run: |
          packaging/notices/gen.sh --package windows --shim-notices notices/THIRD_PARTY_NOTICES.md --out dist/windows-notices.md
          echo "PKG_VERSION=$(. packaging/version.sh && echo "$MOONSEC_VERSION")" >> "$GITHUB_ENV"
      - name: IddCx driver package (attestation-signed)
        if: inputs.idd_package_url != '' && matrix.arch == 'x64'
        run: |
          curl -sSfL "${{ inputs.idd_package_url }}" -o "$RUNNER_TEMP/idd.zip"
          mkdir -p idd && unzip -q "$RUNNER_TEMP/idd.zip" -d idd
          inf="$(find idd -iname MoonsecIdd.inf | head -1)"; echo "IDD_DIR=$(dirname "$inf")" >> "$GITHUB_ENV"
      - name: MSI
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $a = @{ Arch = "${{ matrix.arch }}"; BinDir = "zig-out/bin"; Notices = "dist/windows-notices.md"; Version = $env:PKG_VERSION; Out = "dist" }
          if ($env:IDD_DIR) { $a.IddDir = $env:IDD_DIR }
          if ("${{ inputs.require_signing }}" -eq "true") { $a.RequireSigning = $true }
          & packaging/windows/build.ps1 @a
      - name: Install the MSI and check the service (unsigned builds too)
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/l*v", "msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; throw "msiexec /i failed ($($p.ExitCode))" }
          Get-Service moonsec | Format-List Name, Status, StartType
          if ((Get-Service moonsec).Status -ne "Running") { throw "moonsec service is not running" }
          & "$env:ProgramFiles\moonsec\moonsec.exe" pattern --out "$env:RUNNER_TEMP\p.ppm"
          if ($LASTEXITCODE -ne 0) { throw "installed moonsec.exe failed" }
          Get-Content "$env:ProgramData\moonsec\service.log" -ErrorAction SilentlyContinue
          $p = Start-Process msiexec -ArgumentList "/x", "`"$($msi.FullName)`"", "/qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x failed ($($p.ExitCode))" }
          if (Get-Service moonsec -ErrorAction SilentlyContinue) { throw "service left behind after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows-${{ matrix.arch }}
          path: dist/*.msi

  macos:
    name: macos universal
    needs: notices
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - id: shim
        working-directory: shim
        run: |
          if grep -q '^ *\.iroh_shim_' ../build.zig.zon; then echo "flag=-Dshim=prebuilt" >> "$GITHUB_OUTPUT"; exit 0; fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build moonsec (arm64 and x86_64)
        run: |
          zig build install-moonsec ${{ steps.shim.outputs.flag }} -Dtarget=aarch64-macos.11.0 -Doptimize=ReleaseSafe -p out-arm64
          zig build install-moonsec ${{ steps.shim.outputs.flag }} -Dtarget=x86_64-macos.11.0 -Doptimize=ReleaseSafe -p out-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: shim-notices
          path: notices
      - name: Notices
        run: packaging/notices/gen.sh --package macos --shim-notices notices/THIRD_PARTY_NOTICES.md --out dist/macos-notices.md
      - name: .app, .pkg, .dmg (signed and notarized when the secrets are set)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          packaging/macos/build.sh --bin-arm64 out-arm64/bin/moonsec --bin-x86_64 out-x86_64/bin/moonsec \
            --notices dist/macos-notices.md --out dist ${{ inputs.require_signing && '--require-signing' || '' }}
      - name: Check the packages
        run: |
          pkgutil --payload-files dist/*.pkg | grep -E 'moonsec Host.app/Contents/MacOS/moonsec$|LaunchAgents/com.github.progrium.moonsec.host.plist$'
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/moonsec-dmg dist/*.dmg
          codesign --verify --deep --strict --verbose=2 "/tmp/moonsec-dmg/moonsec Host.app"
          "/tmp/moonsec-dmg/moonsec Host.app/Contents/MacOS/moonsec" pattern --out /tmp/p.ppm
          hdiutil detach /tmp/moonsec-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos-universal
          path: |
            dist/*.pkg
            dist/*.dmg

  release:
    name: draft release
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "moonsec ${GITHUB_REF_NAME#v}" --notes "Installers for Linux, Windows and macOS. Checksums in SHA256SUMS." *

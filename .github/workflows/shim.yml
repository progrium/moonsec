name: shim

# Build the iroh shim for every target, link it into Zig (static and dynamic), run the
# datagram echo, check -Dshim=prebuilt against the fresh archives, and record artifact
# sizes. Tags `shim-v*` publish a release; shim/pin-release.sh then pins it in
# build.zig.zon, and the `prebuilt` job builds from those pinned archives without Rust.

on:
  # Every branch push runs the matrix (also covers PR branches in this repo).
  push:
    branches: ["**"]
    tags: ["shim-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always

jobs:
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by shim/rust-toolchain.toml)
        working-directory: shim
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate THIRD_PARTY_NOTICES.md
        working-directory: shim
        run: |
          cargo about generate --locked --fail -c about.toml -o THIRD_PARTY_NOTICES.md about.hbs
          grep -c '^- \[' THIRD_PARTY_NOTICES.md | xargs echo "crate entries:"
      - uses: actions/upload-artifact@v4
        with:
          name: shim-notices
          path: shim/THIRD_PARTY_NOTICES.md

  build:
    name: ${{ matrix.name }}
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            rust: [x86_64-unknown-linux-gnu]
            zig_target: x86_64-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            rust: [aarch64-unknown-linux-gnu]
            zig_target: aarch64-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            rust: [x86_64-pc-windows-msvc]
            zig_target: x86_64-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            rust: [aarch64-pc-windows-msvc]
            zig_target: aarch64-windows-msvc
          - name: macos-universal
            os: macos-15
            rust: [aarch64-apple-darwin, x86_64-apple-darwin]
            zig_target: aarch64-macos.11.0
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      DIST: dist/iroh-shim-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        if: matrix.name != 'windows-aarch64'
        with:
          version: ${{ env.ZIG_VERSION }}

      # The native aarch64-windows Zig 0.16.0 build segfaults on start on windows-11-arm;
      # run the x86_64 build under Windows' x64 emulation instead (targets stay explicit).
      - name: Zig (x86_64 under emulation)
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: |
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip" -o "$RUNNER_TEMP/zig.zip"
          unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Rust toolchain (pinned by shim/rust-toolchain.toml)
        shell: bash
        working-directory: shim
        run: |
          if ! command -v rustup >/dev/null; then
            case "$RUNNER_OS-$RUNNER_ARCH" in
              Windows-ARM64) curl -sSfL https://win.rustup.rs/aarch64 -o "$RUNNER_TEMP/rustup-init.exe" ;;
              Windows-*) curl -sSfL https://win.rustup.rs/x86_64 -o "$RUNNER_TEMP/rustup-init.exe" ;;
              *) curl -sSfL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh" ;;
            esac
            if [ -f "$RUNNER_TEMP/rustup-init.exe" ]; then "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            else sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain none --profile minimal; fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ join(matrix.rust, ' ') }}
          rustc -Vv

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shim/target
          key: shim-${{ matrix.name }}-${{ hashFiles('shim/Cargo.lock', 'shim/rust-toolchain.toml') }}

      - name: Build shim
        shell: bash
        working-directory: shim
        run: |
          for t in ${{ join(matrix.rust, ' ') }}; do
            cargo build --release --locked --target "$t"
            # Record what the static archive needs from the system linker.
            cargo rustc --release --locked --target "$t" --lib --crate-type staticlib -- --print native-static-libs 2>&1 \
              | grep native-static-libs | tee "target/$t/native-static-libs.txt" || true
          done

      - uses: actions/download-artifact@v4
        with:
          name: shim-notices
          path: notices

      - name: Package shim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST/lib" "$DIST/include"
          cp shim/include/iroh_shim.h "$DIST/include/"
          cp notices/THIRD_PARTY_NOTICES.md "$DIST/"
          case "${{ matrix.name }}" in
            macos-*)
              a=shim/target/aarch64-apple-darwin/release; x=shim/target/x86_64-apple-darwin/release
              lipo -create "$a/libiroh_shim.a" "$x/libiroh_shim.a" -output "$DIST/lib/libiroh_shim.a"
              lipo -create "$a/libiroh_shim.dylib" "$x/libiroh_shim.dylib" -output "$DIST/lib/libiroh_shim.dylib"
              lipo -info "$DIST/lib/libiroh_shim.a" ;;
            windows-*)
              r=shim/target/${{ matrix.rust[0] }}/release
              cp "$r/iroh_shim.lib" "$r/iroh_shim.dll" "$r/iroh_shim.dll.lib" "$DIST/lib/" ;;
            linux-*)
              r=shim/target/${{ matrix.rust[0] }}/release
              cp "$r/libiroh_shim.a" "$r/libiroh_shim.so" "$DIST/lib/" ;;
          esac
          cat shim/target/*/native-static-libs.txt > "$DIST/native-static-libs.txt" || true
          tar -C dist -czf "dist/iroh-shim-${{ matrix.name }}.tar.gz" "iroh-shim-${{ matrix.name }}"

      - name: Link into Zig (static) and run echo
        shell: bash
        run: |
          zig build -Dshim=dir -Dshim-dir="$DIST" -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p out-static
          out-static/bin/shim-echo selftest -n 500

      - name: Link into Zig (dynamic) and run echo
        shell: bash
        run: |
          zig build -Dshim=dir -Dshim-dir="$DIST" -Dshim-link=dynamic -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p out-dynamic
          out-dynamic/bin/shim-echo selftest -n 500

      - name: macOS x86_64 slice (link, run under Rosetta if present)
        if: startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          zig build -Dshim=dir -Dshim-dir="$DIST" -Dtarget=x86_64-macos.11.0 -Doptimize=ReleaseSafe -p out-x86_64
          file out-x86_64/bin/shim-echo
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 out-x86_64/bin/shim-echo selftest -n 200; else echo "Rosetta not available; link-only"; fi

      # Same archive, through the build.zig.zon path that app builds use: serve dist/
      # locally, pin it with shim/pin-release.sh, build with -Dshim=prebuilt.
      - name: -Dshim=prebuilt from this archive
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" -m http.server 8765 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          srv=$!
          trap 'kill $srv 2>/dev/null || true; git checkout -- build.zig.zon' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null "http://127.0.0.1:8765/iroh-shim-${{ matrix.name }}.tar.gz" && break; sleep 1; done
          SHIM_TARGETS=${{ matrix.name }} shim/pin-release.sh --base-url http://127.0.0.1:8765
          git diff build.zig.zon
          zig build -Dshim=prebuilt -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p out-prebuilt
          out-prebuilt/bin/shim-echo selftest -n 200

      - name: Echo over n0 relays (informational)
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: out-static/bin/shim-echo selftest --relay -n 50

      - name: Record sizes
        shell: bash
        run: |
          set -euo pipefail
          size() { if [ -f "$1" ]; then wc -c < "$1" | tr -d ' '; else echo 0; fi; }
          exe=""; case "${{ matrix.name }}" in windows-*) exe=".exe";; esac
          {
            echo "### ${{ matrix.name }}"
            echo "| artifact | bytes |"
            echo "| --- | ---: |"
            for f in "$DIST"/lib/*; do echo "| lib/$(basename "$f") | $(size "$f") |"; done
            echo "| iroh-shim-${{ matrix.name }}.tar.gz | $(size dist/iroh-shim-${{ matrix.name }}.tar.gz) |"
            echo "| shim-echo$exe (static, ReleaseSafe) | $(size out-static/bin/shim-echo$exe) |"
            echo "| shim-echo$exe (dynamic, ReleaseSafe) | $(size out-dynamic/bin/shim-echo$exe) |"
            echo
            echo '```'; cat "$DIST/native-static-libs.txt" 2>/dev/null || true; echo '```'
          } > "dist/sizes-${{ matrix.name }}.md"
          cat "dist/sizes-${{ matrix.name }}.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: iroh-shim-${{ matrix.name }}
          path: |
            dist/iroh-shim-${{ matrix.name }}.tar.gz
            dist/sizes-${{ matrix.name }}.md

  release:
    if: startsWith(github.ref, 'refs/tags/shim-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          {
            echo "Pin this release for \`-Dshim=prebuilt\` with \`shim/pin-release.sh ${GITHUB_REF_NAME}\`."
            echo "Each archive carries THIRD_PARTY_NOTICES.md (also attached)."
            echo
            cat sizes-*.md
          } > NOTES.md
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes-file NOTES.md *.tar.gz SHA256SUMS THIRD_PARTY_NOTICES.md

  # App-build path: no Rust, archives fetched by hash from build.zig.zon.
  prebuilt:
    name: prebuilt ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, zig_target: x86_64-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-22.04-arm, zig_target: aarch64-linux-gnu }
          - { name: windows-x86_64, os: windows-2022, zig_target: x86_64-windows-msvc }
          - { name: windows-aarch64, os: windows-11-arm, zig_target: aarch64-windows-msvc }
          - { name: macos-universal, os: macos-15, zig_target: aarch64-macos.11.0 }
    steps:
      - uses: actions/checkout@v4
      - id: pinned
        shell: bash
        run: |
          if grep -q '^ *\.iroh_shim_' build.zig.zon; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::build.zig.zon pins no shim release yet; skipping (run shim/pin-release.sh after tagging)"; fi
      - uses: mlugg/setup-zig@v2
        if: steps.pinned.outputs.yes && matrix.name != 'windows-aarch64'
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Zig (x86_64 under emulation)
        if: steps.pinned.outputs.yes && matrix.name == 'windows-aarch64'
        shell: bash
        run: |
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip" -o "$RUNNER_TEMP/zig.zip"
          unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build and run echo (static)
        if: steps.pinned.outputs.yes
        shell: bash
        run: |
          if command -v cargo >/dev/null; then echo "cargo on PATH is not used by -Dshim=prebuilt"; fi
          zig build -Dshim=prebuilt -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p out-static
          out-static/bin/shim-echo selftest -n 200
      - name: Build and run echo (dynamic)
        if: steps.pinned.outputs.yes
        shell: bash
        run: |
          zig build -Dshim=prebuilt -Dshim-link=dynamic -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe -p out-dynamic
          out-dynamic/bin/shim-echo selftest -n 200

name: windows

# Windows platform backends (platform/windows, platform/host/windows, platform/client/windows).
# The windows-2022 runner has no GPU and no audio device: tests use WARP, the Microsoft
# Basic Render Driver and Media Foundation's software codecs, and skip hardware paths.
# Linux cross-compiles the same tests for x86_64 and aarch64 Windows.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Windows platform tests
        run: zig build test-win --summary all

  cross:
    name: cross-compile (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check platform
      - name: Cross-compile for x86_64 and aarch64 Windows
        run: zig build check-win --summary all

name: windows

# Windows platform backends (platform/windows, platform/host/windows, platform/client/windows).
# The windows-2022 runner has no GPU and no audio device: tests use WARP, the Microsoft
# Basic Render Driver and Media Foundation's software codecs, and skip hardware paths.
# Linux cross-compiles the same tests for x86_64 and aarch64 Windows.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Windows platform tests
        # Fail instead of skipping for what this runner has: Media Foundation's software
        # H.264 encoder and an interactive desktop for SendInput. Desktop Duplication,
        # NVENC and loopback audio need hardware the runner lacks and skip.
        env:
          MOONSEC_REQUIRE: mf,input
        run: zig build test-win --summary all

  vigem:
    # The virtual gamepad path end to end (docs/virtual-gamepad.md): install the last
    # signed ViGEmBus release, plug an Xbox 360 controller and read it back with XInput.
    name: vigem (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install ViGEmBus 1.22.0
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\ViGEmBus_1.22.0_x64_x86_arm64.exe"
          Invoke-WebRequest -Uri https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($hash -ne "89220A7865076B342892F98865F3499FB7C4CFD673159E89D352C360FD014C6A") { throw "unexpected installer hash $hash" }
          $log = "$env:RUNNER_TEMP\vigem-install.log"
          $p = Start-Process -FilePath $exe -ArgumentList "/exenoui","/qn","/norestart","/l*v","`"$log`"" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if (Test-Path $log) { Select-String -Path $log -Pattern "Return value 3","LaunchCondition","error","Error 1","SetupAPI","DIFx","pnputil","devcon" -Context 3,3 | Select-Object -First 40 | Out-String -Width 300 }
          Get-ChildItem "$env:WINDIR\INF\setupapi.dev.log" | ForEach-Object { Get-Content $_ -Tail 60 }
          Get-Service ViGEmBus -ErrorAction Continue | Format-List Name,Status,StartType
          Get-PnpDevice -FriendlyName "*Virtual Gamepad*" -ErrorAction SilentlyContinue | Format-Table -AutoSize Status,Class,FriendlyName,InstanceId
          Get-CimInstance Win32_SystemDriver -Filter "Name='ViGEmBus'" | Format-List Name,State,PathName
      - name: Virtual gamepad tests
        env:
          MOONSEC_REQUIRE: vigem
        run: zig build test-win --summary all

  cross:
    name: cross-compile (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check platform
      - name: Cross-compile for x86_64 and aarch64 Windows
        run: zig build check-win --summary all

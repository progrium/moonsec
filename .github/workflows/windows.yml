name: windows

# Windows platform backends (platform/windows, platform/host/windows, platform/client/windows).
# The windows-2022 runner has no GPU and no audio device: tests use WARP, the Microsoft
# Basic Render Driver and Media Foundation's software codecs, and skip hardware paths.
# Linux cross-compiles the same tests for x86_64 and aarch64 Windows.

# Automatic triggers are off (turned off on request); run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Windows platform tests
        # Fail instead of skipping for what this runner has: Media Foundation's software
        # H.264 encoder and an interactive desktop for SendInput. Desktop Duplication,
        # NVENC and loopback audio need hardware the runner lacks and skip.
        env:
          MOONSEC_REQUIRE: mf,input
        run: zig build test-win --summary all
      - name: Recovery gate on Media Foundation (IDR fallback, WARP)
        # Media Foundation's software encoder has no long-term references, so every loss
        # must recover through an IDR. NVENC, AMF and oneVPL runs need their GPUs
        # (tools/recovery/README.md). Runs even when test-win fails, so the gate's result
        # is reported on its own.
        if: ${{ !cancelled() }}
        run: zig build recovery -Doptimize=ReleaseSafe -- --backend win-mf --size 640x360 --bitrate 2000000 --frames 600 --expect idr --json recovery-win-mf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-win-mf
          path: recovery-win-mf.json
          if-no-files-found: ignore

  cross:
    name: cross-compile (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check platform
      - name: Cross-compile for x86_64 and aarch64 Windows
        run: zig build check-win --summary all

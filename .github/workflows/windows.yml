name: windows

# Windows platform backends (platform/windows, platform/host/windows, platform/client/windows).
# The windows-2022 runner has no GPU and no audio device: tests use WARP, the Microsoft
# Basic Render Driver and Media Foundation's software codecs, and skip hardware paths.
# Linux cross-compiles the same tests for x86_64 and aarch64 Windows.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Windows platform tests
        # Fail instead of skipping for what this runner has: Media Foundation's software
        # H.264 encoder and an interactive desktop for SendInput. Desktop Duplication,
        # NVENC and loopback audio need hardware the runner lacks and skip.
        env:
          MOONSEC_REQUIRE: mf,input
        run: zig build test-win --summary all

  idd:
    # The virtual display driver (platform/windows/idd), built with the runner's WDK and
    # test-signed. The package is uploaded for installing on a real machine.
    name: virtual display driver (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test-sign (x64)
        shell: pwsh
        run: ./platform/windows/idd/build.ps1 -Platform x64
      - uses: actions/upload-artifact@v4
        with:
          name: moonsec-idd-x64
          path: platform/windows/idd/out/package-x64
          if-no-files-found: error
      # Experimental: install the test-signed package on the runner (trusting its
      # certificate; test-signing mode stays off) with a root device, since creating the
      # software device is refused there (E_ACCESSDENIED), and run the virtual display tests. Neither step fails the job; the summary says
      # how far it got. The real check is on a GPU machine (platform/windows/idd/README.md).
      - name: Try installing the driver on the runner
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          ./platform/windows/idd/out/package-x64/install.ps1 -RootDevice
          pnputil /enum-drivers | Select-String -Context 0,6 moonsecidd
          Get-PnpDevice -FriendlyName "moonsec*" | ForEach-Object {
            $_ | Format-List InstanceId, FriendlyName, Status, Problem, ProblemDescription
            Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName DEVPKEY_Device_ProblemCode, DEVPKEY_Device_ProblemStatus, DEVPKEY_Device_DriverVersion | Format-Table KeyName, Data
          }
      - name: Driver events
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-WinEvent -LogName "Microsoft-Windows-DriverFrameworks-UserMode/Operational" -MaxEvents 30 -ErrorAction SilentlyContinue | Format-Table TimeCreated, Id, Message -Wrap
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-15)} -MaxEvents 40 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'moonsec|WUDF|IddCx|Indirect' } | Format-Table TimeCreated, Id, ProviderName, Message -Wrap
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Virtual display tests on the runner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          zig build test-win --summary all 2>&1 | tee idd-test.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          touch idd-test.log
          {
            echo '### Virtual display driver on the windows-2022 runner'
            echo "install: ${{ steps.install.outcome }}"
            echo '```'
            grep -E 'virtual display|skip idd|active as|idd' idd-test.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cross:
    name: cross-compile (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: zig fmt
        run: zig fmt --check platform
      - name: Cross-compile for x86_64 and aarch64 Windows
        run: zig build check-win --summary all

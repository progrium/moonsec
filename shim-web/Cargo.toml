[package]
name = "moonsec-iroh-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "iroh for the moonsec web client: wasm-bindgen API over iroh 1.4.1, relay-only"
publish = false

[lib]
name = "iroh_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same iroh as the native shim (shim/Cargo.toml). In the browser iroh has no UDP sockets:
# every path goes through a relay over WebSocket (wasm_browser cfg inside iroh).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
bytes = "1.11"
n0-future = "0.3"
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# iroh pulls getrandom 0.4 with wasm_js; older majors in the tree need their own switch.
getrandom = { version = "0.4", features = ["wasm_js"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

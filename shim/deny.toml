# cargo-deny policy for the shim and shim-web (docs/security-review.md, "Dependencies").
#   cd shim && cargo deny check
#   cd shim-web && cargo deny --config ../shim/deny.toml check
# The licence list matches about.toml (the notices); keep the two in step.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail unless listed here with a reason.
unmaintained = "all"
unused-ignored-advisory = "allow"
ignore = [
    # Both arrive only through iroh 1.4.1 and have no maintained drop-in in its tree.
    # Neither is a vulnerability; revisit when iroh updates them.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via heapless 0.7 <- postcard <- iroh-relay; unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro, build time only) via netlink-packet-core <- netwatch <- iroh; unmaintained, no known vulnerability" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    # ws_stream_wasm, pharos, async_io_stream: iroh-relay's browser WebSocket (wasm32 only).
    "Unlicense",
]
# One list for both crates, so some entries go unused in each.
unused-allowed-license = "allow"
confidence-threshold = 0.9
# The shim crates themselves are not distributed as crates.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "s10-noq-shim"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike S10: sans-I/O C ABI over noq-proto; the Zig core owns socket, timers and pacing"

[lib]
name = "s10noq"
crate-type = ["staticlib"]

[dependencies]
# Same noq-proto that iroh 1.4.1 pins (via noq 1.4.0).
noq-proto = { version = "=1.4.0", default-features = false, features = ["rustls", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto", "pem"] }
bytes = "1"
# Only for the `rv` feature: iroh as the rendezvous/control channel for the punch demo.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }
anyhow = { version = "1", optional = true }

[features]
rv = ["dep:iroh", "dep:tokio", "dep:anyhow"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"

[package]
name = "s3-congestion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
anyhow = "1"
libc = "0.2.191"

[profile.release]
debug = 1

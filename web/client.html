<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>moonsec web client</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 13px/1.3 ui-monospace, monospace; }
      #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #video { max-width: 100%; max-height: 100%; background: #000; }
      #overlay { position: absolute; top: 8px; left: 8px; margin: 0; padding: 6px 8px; background: rgba(0, 0, 0, 0.6); white-space: pre; pointer-events: none; }
      #overlay[data-relayed="true"]::after { content: "relayed"; margin-left: 8px; padding: 0 4px; background: #b36b00; color: #fff; }
      #start { position: absolute; padding: 12px 20px; font: inherit; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="video" width="640" height="360"></canvas>
      <pre id="overlay"></pre>
      <button id="start">Connect</button>
    </div>
    <script type="module" src="dist/client-page.js"></script>
  </body>
</html>

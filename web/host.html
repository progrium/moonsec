<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Must run before the game: AudioContext tap, virtual gamepads, frame hook. -->
    <script src="dist/host-patch.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>moonsec browser host</title>
    <style>
      html, body { margin: 0; background: #000; color: #eee; font: 13px/1.4 ui-monospace, monospace; }
      main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
      #game { max-width: 100%; background: #000; }
      #panel { width: 960px; max-width: 100%; white-space: pre-wrap; word-break: break-all; }
      #panel a { color: #8cf; }
      button { font: inherit; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="540" tabindex="0"></canvas>
      <button id="start">Start hosting</button>
      <pre id="panel"></pre>
    </main>
    <script src="demo/orb-drift.js"></script>
    <script type="module" src="dist/host-page.js"></script>
  </body>
</html>
